# Namespace `r-tulika` is pre-existing (not declared here). Reconstructed
# 2026-09-24 from the live cluster state: the previous version of this file
# declared namespace `ci-cd` (never where this app actually ran), image
# `registry.me/r-tulika:latest` (not a registry this cluster ever pulls
# from), replicas: 1 (live runs 2), and only the r-tulika.me Ingress -- the
# tulikas.de one didn't exist here at all. It had never actually been
# applied; the live objects were set up directly via Rancher's UI. See
# randrost/tls-infra README for the --reuse-values incident that prompted
# checking this file against reality instead of trusting it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r-tulika
  namespace: r-tulika
spec:
  replicas: 2
  selector:
    matchLabels:
      app: r-tulika
  template:
    metadata:
      labels:
        app: r-tulika
    spec:
      containers:
        - name: r-tulika
          image: registry.tulikas.de/r-tulika:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: r-tulika
  namespace: r-tulika
spec:
  selector:
    app: r-tulika
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: r-tulika
  namespace: r-tulika
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-cache-key: "$scheme$request_method$host$request_uri"
    nginx.ingress.kubernetes.io/proxy-cache-use-stale: "error timeout updating http_500 http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-cache-revalidate: "on"
    nginx.ingress.kubernetes.io/proxy-cache-bypass: "$http_cache_control"
    nginx.ingress.kubernetes.io/proxy-cache: "true"
    nginx.ingress.kubernetes.io/proxy-cache-valid: "200 302 10m"
spec:
  tls:
    - hosts:
        - r-tulika.me
      secretName: r-tulika-tls
  rules:
    - host: r-tulika.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: r-tulika
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: r-tulika-tulikas
  namespace: r-tulika
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-cache-key: "$scheme$request_method$host$request_uri"
    nginx.ingress.kubernetes.io/proxy-cache-use-stale: "error timeout updating http_500 http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-cache-revalidate: "on"
    nginx.ingress.kubernetes.io/proxy-cache-bypass: "$http_cache_control"
    nginx.ingress.kubernetes.io/proxy-cache: "true"
    nginx.ingress.kubernetes.io/proxy-cache-valid: "200 302 10m"
spec:
  tls:
    - hosts:
        - tulikas.de
      secretName: r-tulika-tulikas-tls
  rules:
    - host: tulikas.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: r-tulika
                port:
                  number: 80
